apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fraudshield
resources:
  - namespace.yaml
  - config.yaml
  - infra.yaml
  - apps.yaml
  - frontend.yaml
  - network-policy.yaml
# Point the images at your registry, e.g.  kustomize edit set image ghcr.io/your-org/...=...
images:
  - name: ghcr.io/your-org/fraudshield-gateway
    newTag: 1.0.0
  - name: ghcr.io/your-org/fraudshield-txn-service
    newTag: 1.0.0
  - name: ghcr.io/your-org/fraudshield-risk-engine
    newTag: 1.0.0
  - name: ghcr.io/your-org/fraudshield-case-service
    newTag: 1.0.0
  - name: ghcr.io/your-org/fraudshield-frontend
    newTag: 1.0.0
