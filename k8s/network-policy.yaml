# Zero-trust between tiers. Internal services trust the X-User-* identity headers set by the
# gateway, so only the gateway (and the services themselves) may reach them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-ingress-from-gateway-only
spec:
  podSelector:
    matchExpressions:
      - { key: app, operator: In, values: [txn-service, risk-engine, case-service] }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app, operator: In, values: [gateway, txn-service, risk-engine, case-service] }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-tier-from-apps-only
spec:
  podSelector:
    matchLabels: { tier: data }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { tier: app } }
        - podSelector: { matchLabels: { tier: data } }
