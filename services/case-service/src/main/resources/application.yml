spring:
  application:
    name: case-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cases}
    username: ${DB_USER:fraudshield}
    password: ${DB_PASSWORD:fraudshield}
    hikari:
      maximum-pool-size: 15
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
  mvc:
    async:
      request-timeout: -1

server:
  port: ${PORT:8083}
  shutdown: graceful

fraudshield:
  risk-engine-url: ${RISK_ENGINE_URL:http://localhost:8082}
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-this-is-a-32+-byte-dev-secret}
    ttl: 8h
  ai:
    provider: ${AI_PROVIDER:none}
    api-key: ${AI_API_KEY:}
    base-url: ${AI_BASE_URL:}
    model: ${AI_MODEL:}
    temperature: 0.2
    timeout: ${AI_TIMEOUT:60s}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
